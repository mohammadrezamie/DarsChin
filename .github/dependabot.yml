# Keep updates reviewed, small, and compatible with the committed Bun lockfile.
# Dependabot is advisory and opens PRs only; production deployment remains manual.
version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      routine-patch-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor"]
      security-remediation:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      action-updates:
        patterns: ["*"]
