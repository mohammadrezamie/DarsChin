name: DarsChin main quality gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darschin-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify isolated synthetic test database and production bundle
        run: bun run verify
      - name: Report verified commit
        if: success()
        run: echo "Verified commit $GITHUB_SHA"
