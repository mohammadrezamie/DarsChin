name: DarsChin main quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".env.example"
      - "deploy/**"
      - "compose*.yaml"
      - ".gitignore"
      - ".dockerignore"
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/main-quality-gate.yml"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/PERMANENT_SECURITY_POLICY_FA.md"
      - "docs/SECURITY_INCIDENT_RUNBOOK_20261101_FA.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darschin-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify isolated synthetic test database and production bundle
        run: bun run verify
      - name: Report verified commit
        if: success()
        run: echo "Verified commit $GITHUB_SHA"
